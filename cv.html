<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentang Saya | Sofyan Macmud AD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');
        
        :root {
            --neon-blue: #00f2ff;
            --neon-red: #ff0055;
            --dark-bg: #0a0a0f;
            --section-bg: #0d0d14;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--dark-bg);
            color: #e0e0e0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, h4, .font-orbitron { font-family: 'Orbitron', sans-serif; }

        /* --- COMPONENTS --- */
        .glass-cyber {
            background: rgba(15, 15, 25, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 242, 255, 0.1);
        }

        main { flex: 1; display: flex; align-items: center; padding-top: 80px; }
        
        section {
            width: 100%;
            padding: 80px 20px;
        }

        /* --- HERO DECORATION --- */
        .profile-img-container {
            position: relative;
            width: 300px;
            height: 300px;
        }
        .profile-img-container::before {
            content: ''; position: absolute; top: -20px; left: -20px; right: -20px; bottom: -20px;
            border: 2px dashed var(--neon-blue); border-radius: 50%; animation: spin-slow 20s linear infinite;
        }
        .profile-img-container::after {
            content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border: 3px solid var(--neon-red); border-radius: 50%; box-shadow: 0 0 20px var(--neon-red);
        }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .btn-futuristic {
            position: relative; padding: 1rem 2.5rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--neon-blue); background: transparent;
            border: 1px solid var(--neon-blue); clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%);
            transition: all 0.3s ease; display: inline-block;
        }
        .btn-futuristic:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 30px var(--neon-blue); transform: scale(1.05); }

        .grid-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; pointer-events: none; z-index: -1;
        }
        .gradient-text { background: linear-gradient(90deg, var(--neon-blue), var(--neon-red)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    </style>
</head>
<body>
    <div class="grid-overlay"></div>

    <!-- NAVIGASI -->
    <nav class="fixed top-0 w-full z-50 glass-cyber border-b border-white/5">
        <div class="max-w-7xl mx-auto px-8 py-5 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-blue-400 font-bold font-orbitron text-xl tracking-tighter">SM<span class="text-red-500">.</span>AD</span>
            </div>
            <div class="hidden md:flex space-x-10">
                <a href="about.html" class="text-xs uppercase tracking-[0.3em] text-cyan-400 font-bold">About</a>
                <a href="cv.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">CV</a>
                <a href="projects.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">Projects</a>
                <a href="awards.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">Awards</a>
                <a href="reflection.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">Reflection</a>
                <a href="contact.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">Contact</a>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <main>
        <section>
            <div class="max-w-6xl mx-auto w-full grid md:grid-cols-2 gap-16 items-center">
                <div class="space-y-8 order-2 md:order-1">
                    <div class="inline-block border border-red-500/50 px-3 py-1 text-red-500 text-[10px] font-mono tracking-widest uppercase">
                        >> Memulai Inisialisasi Sistem
                    </div>
                    <h1 class="text-6xl md:text-7xl font-bold leading-tight uppercase">
                        Halo, Saya <br><span class="gradient-text">Sofyan Macmud</span>
                    </h1>
                    <p class="text-gray-400 text-xl font-light leading-relaxed max-w-lg">
                        Seorang arsitek digital yang mendedikasikan diri untuk membangun solusi teknologi dengan estetika modern dan efisiensi sistem yang tinggi.
                    </p>
                    <div class="pt-6">
                        <a href="contact.html" class="btn-futuristic">Hubungi Saya</a>
                    </div>
                </div>
                <div class="flex justify-center order-1 md:order-2">
                    <div class="profile-img-container">
                        <img src="https://lh3.googleusercontent.com/d/1j-7inCq1W9zjtmBGISc0psejyU_auOiK" 
                             alt="[Foto Profil Sofyan Macmud AD]" 
                             class="w-full h-full object-cover rounded-full p-3 bg-slate-900">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="py-6 text-center border-t border-white/5 bg-black mt-auto">
        <div class="max-w-6xl mx-auto px-8 flex justify-center">
            <p class="text-[10px] text-gray-600 font-mono tracking-[0.3em] uppercase">COPYRIGHT © 2024 SOFYAN MACMUD AD</p>
        </div>
    </footer>
</body>
</html>
