<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curriculum Vitae | Sofyan Macmud AD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');
        :root { --neon-blue: #00f2ff; --neon-red: #ff0055; --dark-bg: #0a0a0f; --section-bg: #0d0d14; }
        body { font-family: 'Rajdhani', sans-serif; background-color: var(--section-bg); color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column;}
        h1, h2, h3, h4, .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-cyber { background: rgba(15, 15, 25, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.1); }
        main { flex: 1; padding-top: 120px; padding-bottom: 80px; }
        
        .section-header { margin-bottom: 60px; position: relative; }
        .section-header h2 { font-size: 2.5rem; letter-spacing: 0.2em; text-transform: uppercase; }
        .section-header::after { content: ''; position: absolute; bottom: -15px; left: 0; width: 60px; height: 4px; background: var(--neon-red); }
        
        .cyber-card { background: rgba(20, 20, 30, 0.8); border: 1px solid rgba(255, 255, 255, 0.05); padding: 2rem; transition: all 0.4s; height: 100%; }
        .cyber-card:hover { border-color: var(--neon-blue); transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0, 242, 255, 0.1); }
        .grid-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: -1; }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>

    <!-- NAVIGASI -->
    <nav class="fixed top-0 w-full z-50 glass-cyber border-b border-white/5">
        <div class="max-w-7xl mx-auto px-8 py-5 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-blue-400 font-bold font-orbitron text-xl tracking-tighter">SM<span class="text-red-500">.</span>AD</span>
            </div>
            <div class="hidden md:flex space-x-10">
                <a href="about.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">About</a>
                <a href="cv.html" class="text-xs uppercase tracking-[0.3em] text-cyan-400 font-bold">CV</a>
                <a href="projects.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">Projects</a>
                <a href="awards.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">Awards</a>
                <a href="reflection.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">Reflection</a>
                <a href="contact.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">Contact</a>
            </div>
        </div>
    </nav>

    <main>
        <div class="max-w-5xl mx-auto px-4 w-full">
            <div class="section-header">
                <h2 class="text-white">Curriculum <span class="text-cyan-400">Vitae</span></h2>
            </div>
            <div class="grid md:grid-cols-2 gap-16 mt-12">
                <div class="space-y-12">
                    <h3 class="text-xl font-bold text-red-500 uppercase tracking-widest flex items-center">
                        <i class="fas fa-user-graduate mr-4"></i> Pendidikan
                    </h3>
                    <div class="relative pl-8 border-l border-white/10 space-y-12">
                        <div class="relative">
                            <div class="absolute -left-[36px] top-0 w-4 h-4 bg-red-500 rounded-full border-4 border-dark-bg"></div>
                            <span class="text-sm font-mono text-cyan-400">2021 - 2024</span>
                            <h4 class="text-xl font-bold text-white mt-2">SMPN 228 Jakarta</h4>
                            <p class="text-gray-500 mt-1">JL. Sumur Batu Raya</p>
                        </div>
                        <div class="relative">
                            <div class="absolute -left-[36px] top-0 w-4 h-4 bg-red-500 rounded-full border-4 border-dark-bg"></div>
                            <span class="text-sm font-mono text-cyan-400">2024 - 2027</span>
                            <h4 class="text-xl font-bold text-white mt-2">SMA NEGERI 45 Jakarta</h4>
                            <p class="text-gray-500 mt-1">Jurusan Teknik Informatika</p>
                        </div>
                    </div>
                </div>
                <div class="space-y-12">
                    <h3 class="text-xl font-bold text-blue-500 uppercase tracking-widest flex items-center">
                        <i class="fas fa-tools mr-4"></i> Core Skills
                    </h3>
                    <div class="grid grid-cols-1 gap-4">
                        <div class="bg-slate-900/50 p-6 border border-white/5 cyber-card flex justify-between items-center">
                            <span class="font-mono text-sm tracking-widest">Coding</span>
                            <span class="text-cyan-400">95%</span>
                        </div>
                        <div class="bg-slate-900/50 p-6 border border-white/5 cyber-card flex justify-between items-center">
                            <span class="font-mono text-sm tracking-widest">Basket</span>
                            <span class="text-cyan-400">88%</span>
                        </div>
                        <div class="bg-slate-900/50 p-6 border border-white/5 cyber-card flex justify-between items-center">
                            <span class="font-mono text-sm tracking-widest">Reading</span>
                            <span class="text-cyan-400">90%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-6 text-center border-t border-white/5 bg-black mt-auto">
        <div class="max-w-6xl mx-auto px-8 flex justify-center">
            <p class="text-[10px] text-gray-600 font-mono tracking-[0.3em] uppercase">COPYRIGHT © 2024 SOFYAN MACMUD AD</p>
        </div>
    </footer>
</body>
</html>
