<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak | Sofyan Macmud AD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap');
        :root { --neon-blue: #00f2ff; --neon-red: #ff0055; --section-bg: #0d0d14; }
        body { font-family: 'Rajdhani', sans-serif; background-color: var(--section-bg); color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column;}
        h1, h2, h3, h4, .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-cyber { background: rgba(15, 15, 25, 0.9); backdrop-filter: blur(15px); border: 1px solid rgba(0, 242, 255, 0.1); }
        main { flex: 1; display: flex; align-items: center; padding-top: 120px; padding-bottom: 80px;}
        
        .section-header { margin-bottom: 40px; position: relative; }
        .section-header h2 { font-size: 2.5rem; letter-spacing: 0.2em; text-transform: uppercase; }
        .section-header::after { content: ''; position: absolute; bottom: -15px; left: 0; width: 60px; height: 4px; background: var(--neon-red); }
        
        .btn-futuristic { position: relative; padding: 1rem 2.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--neon-blue); background: transparent; border: 1px solid var(--neon-blue); clip-path: polygon(15% 0, 100% 0, 85% 100%, 0 100%); transition: all 0.3s ease; display: inline-block; cursor: pointer;}
        .btn-futuristic:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 30px var(--neon-blue); }
        
        .grid-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px); background-size: 50px 50px; pointer-events: none; z-index: -1; }
        .gradient-text { background: linear-gradient(90deg, var(--neon-blue), var(--neon-red)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div class="grid-overlay"></div>

    <!-- NAVIGASI -->
    <nav class="fixed top-0 w-full z-50 glass-cyber border-b border-white/5">
        <div class="max-w-7xl mx-auto px-8 py-5 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="text-blue-400 font-bold font-orbitron text-xl tracking-tighter">SM<span class="text-red-500">.</span>AD</span>
            </div>
            <div class="hidden md:flex space-x-10">
                <a href="about.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">About</a>
                <a href="cv.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">CV</a>
                <a href="projects.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">Projects</a>
                <a href="awards.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">Awards</a>
                <a href="reflection.html" class="text-xs uppercase tracking-[0.3em] hover:text-cyan-400 transition font-bold">Reflection</a>
                <a href="contact.html" class="text-xs uppercase tracking-[0.3em] text-cyan-400 font-bold">Contact</a>
            </div>
        </div>
    </nav>

    <main>
        <div class="max-w-6xl mx-auto px-4 w-full">
            <div class="grid md:grid-cols-2 gap-20 items-center">
                <div class="space-y-10">
                    <div class="section-header">
                        <h2 class="text-white leading-tight">kontak <br><span class="gradient-text">Sofyan</span></h2>
                    </div>
                    <p class="text-gray-400 text-lg font-light leading-relaxed">
                        Saluran komunikasi terbuka untuk kolaborasi proyek, konsultasi teknis, atau sekadar bertukar ide inovatif.
                    </p>
                    <div class="space-y-8 pt-4">
                        <div class="flex items-center gap-6 group">
                            <div class="w-14 h-14 bg-slate-900 border border-white/5 flex items-center justify-center text-cyan-400 text-xl group-hover:border-cyan-400 transition">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div>
                                <p class="text-[10px] font-mono text-gray-500 uppercase tracking-widest">E-mail</p>
                                <p class="text-white font-bold tracking-wider">sofyan.macmud@email.com</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-6 group">
                            <div class="w-14 h-14 bg-slate-900 border border-white/5 flex items-center justify-center text-red-500 text-xl group-hover:border-red-500 transition">
                                <i class="fas fa-map-marker-alt"></i>
                            </div>
                            <div>
                                <p class="text-[10px] font-mono text-gray-500 uppercase tracking-widest">Lokasi</p>
                                <p class="text-white font-bold tracking-wider">Jakarta, Indonesia</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="glass-cyber p-12 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-red-500/5 rotate-45 -mr-12 -mt-12"></div>
                    <form class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-mono text-cyan-400 uppercase tracking-widest">Identitas_Nama</label>
                            <input type="text" placeholder="Masukkan Nama" class="w-full bg-slate-900/50 border border-white/10 px-6 py-4 outline-none focus:border-cyan-500 text-white transition text-sm">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-mono text-cyan-400 uppercase tracking-widest">Email_Address</label>
                            <input type="email" placeholder="email@domain.com" class="w-full bg-slate-900/50 border border-white/10 px-6 py-4 outline-none focus:border-cyan-500 text-white transition text-sm">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-mono text-cyan-400 uppercase tracking-widest">Isi_Transmisi</label>
                            <textarea placeholder="Tuliskan pesan Anda di sini..." rows="5" class="w-full bg-slate-900/50 border border-white/10 px-6 py-4 outline-none focus:border-cyan-500 text-white transition text-sm"></textarea>
                        </div>
                        <button type="submit" class="btn-futuristic w-full py-4 font-bold">KIRIM PESAN</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-6 text-center border-t border-white/5 bg-black mt-auto w-full">
        <div class="max-w-6xl mx-auto px-8 flex justify-center items-center">
            <p class="text-[10px] text-gray-600 font-mono tracking-[0.3em] uppercase">
                COPYRIGHT © 2024 SOFYAN MACMUD AD
            </p>
        </div>
    </footer>
</body>
</html>
